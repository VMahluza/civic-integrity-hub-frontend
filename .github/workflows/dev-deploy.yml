name: Victor Deploys to s3

# Trigger
on:
    push:
        branches: ["dev"]
    workflow_dispatch:

concurrency:
    group: cih-{{ github.ref }}
    cancel-in-progress: true

env:
    AWS_REGION: af-south-1
    S3_BUCKET: civic-integrity-hub-frontend-dev
    AWS_ROLE: arn:aws:iam::906580120265:role/civic-integrity-hub-dev-role

permissions:
    id-token: write
    contents: read

jobs:
    configure-aws:
        name: Configure AWS Creds
        runs-on: ubuntu-latest
        steps:
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              timeout-minutes: 5
              with:
                role-to-assume: ${{ env.AWS_ROLE }}
                aws-region: ${{ env.AWS_REGION }}
                retry-max-attempts: 3

            - name: Verify AWS Credentials
              run: |
                if aws s3 ls s3://${{ env.S3_BUCKET }}; then
                    echo "AWS Credentials are valid";
                else
                    echo "AWS Credentials are invalid";
                    exit 1;
                fi
    
    build:
        name: Build Project
        runs-on: ubuntu-latest
        needs: configure-aws
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install Dependencies
              run: npm install

            - name: Build Project
              run: npm run build

            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: build-artifacts
                  path: .next/build/

    deploy:
        name: Deploy to S3
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Download Build Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: build-artifacts
                  path: .next/build/

            - name: Sync to S3
              run: |
                aws s3 sync .next/build/ s3://${{ env.S3_BUCKET }}/ --delete
                timeout-minutes: 10
